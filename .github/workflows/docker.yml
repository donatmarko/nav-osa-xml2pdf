name: Docker

# The service's image: built on every push and pull request, pushed as ghcr.io/<repository> on a
# release or by hand.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.2.0, tagged 1.2.0, 1.2 and 1), or any other tag (e.g. edge). latest only for a final version from main."
        required: false
        default: "edge"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build image (and push on release/dispatch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Determine push eligibility
        id: push
        run: |
          if [[ "${{ github.event_name }}" == "release" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          fi

      # A version given by hand, and whether a final one.
      - name: Classify the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "semver=true" >> "$GITHUB_OUTPUT"
            [[ "$VERSION" == *-* ]] && echo "final=false" >> "$GITHUB_OUTPUT" || echo "final=true" >> "$GITHUB_OUTPUT"
          else
            echo "semver=false" >> "$GITHUB_OUTPUT"
            echo "final=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to the Container registry
        if: steps.push.outputs.should_push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ (github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.version.outputs.final == 'true') }}
            type=sha,prefix=sha-,format=short,enable=${{ steps.push.outputs.should_push == 'true' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ steps.version.outputs.semver == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ steps.version.outputs.semver == 'true' }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ steps.version.outputs.semver == 'true' }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && steps.version.outputs.semver != 'true' }}

      # Built for the runner first and checked, so that no image is pushed that draws no PDF.
      - name: Build for the smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: nav-osa-xml2pdf:smoke
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      - name: Draw NAV's sample invoices
        run: scripts/smoke-test.sh nav-osa-xml2pdf:smoke

      - name: Build (and push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: ${{ steps.push.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
