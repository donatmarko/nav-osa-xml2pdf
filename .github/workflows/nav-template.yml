name: NAV template

# Every week (or by hand): takes NAV's newest invoice data template (scripts/update-template.sh);
# where it has changed, builds the image with it, draws NAV's sample invoices in every language
# (scripts/smoke-test.sh), and opens (or updates) a pull request with the new template. Nothing is
# released by itself: the pull request is reviewed, merged and released by hand.
#
# Needs "Allow GitHub Actions to create and approve pull requests" in the repository's
# Settings › Actions › General. A pull request opened with GITHUB_TOKEN runs no other workflow
# (the Docker workflow's checks among them): where the NAV_TEMPLATE_TOKEN secret is set (a
# fine-grained token with Contents and Pull requests: read and write on this repository), the pull
# request is opened with it instead, and its checks run.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: nav-template
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Take NAV's newest template
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Take the newest template
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous=$(sed -n 's/^commit=//p' template/UPSTREAM)
          commit=$(scripts/update-template.sh)
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- template/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "NAV's template is unchanged (${commit})."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- template/
          fi

      - name: Set up Docker Buildx
        if: steps.update.outputs.changed == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image with it
        if: steps.update.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: nav-osa-xml2pdf:nav-template
          cache-from: type=gha,scope=image

      - name: Draw NAV's sample invoices
        if: steps.update.outputs.changed == 'true'
        run: scripts/smoke-test.sh nav-osa-xml2pdf:nav-template

      - name: Open a pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.NAV_TEMPLATE_TOKEN || secrets.GITHUB_TOKEN }}
          branch: nav-template
          delete-branch: true
          add-paths: template/
          commit-message: "chore: NAV template ${{ steps.update.outputs.commit }}"
          title: "chore: NAV template ${{ steps.update.outputs.commit }}"
          body: |
            NAV's invoice data template has changed:
            https://github.com/nav-gov-hu/Online-Invoice-XSLT/compare/${{ steps.update.outputs.previous }}...${{ steps.update.outputs.commit }}

            Built and checked here: NAV's sample invoices (downloaded from NAV) are drawn into PDFs in HU, EN and DE.
            Look at a real invoice's PDF before releasing.
